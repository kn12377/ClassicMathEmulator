<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Computer iframe Example</title>
    <style>
        body {
            background-color: #3b5998;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: monospace;
        }

        /* The Outer CRT Monitor Frame */
        .computer-monitor {
            background: #d1c7bd;
            border: 12px solid #bdae9e;
            border-bottom-width: 24px;
            border-radius: 30px;
            box-shadow: 
                inset -4px -4px 0px #8a7a6e,
                inset 4px 4px 0px #fff,
                10px 10px 20px rgba(0,0,0,0.3);
            padding: 20px;
            position: relative;
            width: 640px;
            height: 480px;
            box-sizing: border-box;
        }

        /* Inner Bezel / Screen Edge */
        .screen-bezel {
            background: #151515;
            border: 6px solid #8a7a6e;
            border-top-color: #574c43;
            border-left-color: #574c43;
            border-radius: 12px;
            height: 100%;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Glass Screen Effect & Curve Wrapper */
        .screen-glass {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        /* The actual iframe inside the screen */
        .screen-glass iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Subtle Retro CRT Scanline Overlay */
        .screen-glass::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none; /* Allows clicking inside the iframe */
        }

        /* Computer Stand / Base */
        .computer-base {
            width: 160px;
            height: 40px;
            background: #bdae9e;
            margin: -4px auto 0 auto;
            border-left: 10px solid #a89a8a;
            border-right: 10px solid #a89a8a;
            box-shadow: inset 0 4px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: -1;
        }

        .computer-foot {
            width: 300px;
            height: 20px;
            background: #d1c7bd;
            margin: 0 auto;
            border-radius: 4px 4px 0 0;
            border-bottom: 6px solid #8a7a6e;
            box-shadow: 5px 5px 10px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div>
        <!-- Monitor Case -->
        <div class="computer-monitor">
            <!-- Screen Border -->
            <div class="screen-bezel">
                <!-- Inner CRT Glass with Scanlines -->
                <div class="screen-glass">
                    <!-- The iframe content container -->
                    <iframe 
                        src="https://kn12377.github.io/ClassicMathEmulator/Emulatrix_AutoLoad.htm?rom=https://kn12377.github.io/ClassicMathEmulator/DOS-Roms/MONKEY.zip" 
                        title="Retro Computer Screen Display">
                    </iframe>
                </div>
            </div>
        </div>
        <!-- Monitor Stand Base -->
        <div class="computer-base"></div>
        <div class="computer-foot"></div>
    </div>

</body>
</html>
