    <style>
      html,body{background-color:black;height:100%;padding:0;margin:0;overflow:hidden}
      #content{position:fixed;height:100%;width:100%;margin:0;padding:0;border:none;display:none}

      @media only screen and (orientation:portrait) {
        #content{position:fixed;transform:rotate(-90deg);transform-origin:left top;width:100vh;overflow-x:hidden;top:100%;left:0}
      }
    </style>
  </head>
  <body>
    <iframe id="content" src="about:blank"></iframe>
    <script>
      function resizeContent() {
        var w = window.innerWidth
        var h = window.innerHeight

        if (window.innerHeight > window.innerWidth) {
          document.getElementById("content").style.width = h + "px"
          document.getElementById("content").style.height = w + "px"
        } else {
          document.getElementById("content").style.width = w + "px"
          document.getElementById("content").style.height = h + "px"
        }
      }

      var supportsOrientationChange = "onorientationchange" in window
      var orientationEvent = supportsOrientationChange
        ? "orientationchange"
        : "resize"

      window.addEventListener(
        orientationEvent,
        function () {
          resizeContent()
        },
        false
      )

      window.addEventListener("resize", function () {
        resizeContent()
      })

      window.addEventListener("load", function () {
        if (window.top === window.self) {
          resizeContent()

          setInterval(function () {
            if (document.activeElement !== document.getElementById("content")) {
              document.getElementById("content").focus()
            }
          }, 250)

          var titleUpdater = setInterval(function () {
            try {
              if (
                document
                  .getElementById("content")
                  .contentDocument.querySelector("canvas")
              ) {
                document.title = "Emulatrix"
                clearInterval(titleUpdater)
              }
            } catch (err) {
              //
            }
          }, 250)

          var preselectedFile = "https://kn12377.github.io/ClassicMathEmulator/DOS-Roms/DOOM.ZIP"
          document.getElementById("content").src =
            "Emulatrix.htm?file=" + encodeURIComponent(preselectedFile)

          document.getElementById("content").style.display = "block"
        }
      })

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("worker.js")
          .then(function () {
            // Registration successful
          })
          .catch(function () {
            // Registration failed
          })
      }
    </script>
  </body>
