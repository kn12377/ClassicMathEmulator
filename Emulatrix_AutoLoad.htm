<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emulatrix Auto-Load</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        display: block;
        background: #000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      iframe.ready {
        opacity: 1;
        visibility: visible;
      }

      .loader {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 14px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        padding: 10px 14px;
        z-index: 10;
        pointer-events: none;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="loader" id="loader">Loading emulator...</div>
    <iframe id="emulatorFrame" src="Emulatrix.htm"></iframe>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search)
        var romUrl = params.get("rom") || "https://kn12377.github.io/ClassicMathEmulator/DOS-Roms/DOOM.ZIP"
        var romName = params.get("name") || "DOOM.ZIP"

        function setStatus(text) {
          var loader = document.getElementById("loader")
          if (loader) loader.textContent = text
        }

        function hideStartScreen(win) {
          try {
            var doc = win.document
            if (!doc) return

            var menu = doc.querySelector(".container")
            if (menu) menu.style.display = "none"

            var loader = doc.querySelector(".pleasewait")
            if (loader) loader.style.display = "block"
          } catch (err) {
            // ignore timing issues while the page is still initializing
          }
        }

        function revealStarted(win) {
          try {
            var doc = win.document
            if (!doc) return
            var loader = doc.querySelector(".pleasewait")
            if (loader) loader.style.display = "none"
          } catch (err) {
            // ignore
          }
        }

        function tryInject() {
          var frame = document.getElementById("emulatorFrame")
          if (!frame || !frame.contentWindow) {
            setTimeout(tryInject, 150)
            return
          }

          var win = frame.contentWindow

          if (typeof win.runEmulator !== "function") {
            setTimeout(tryInject, 150)
            return
          }

          hideStartScreen(win)

          fetch(romUrl, { mode: "cors" })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("HTTP " + response.status + " while fetching ROM")
              }
              return response.arrayBuffer()
            })
            .then(function (buffer) {
              var file = new File([buffer], romName, {
                type: "application/octet-stream"
              })

              win.runEmulator(file)

              setTimeout(function () {
                revealStarted(win)
                frame.classList.add("ready")
              }, 250)
            })
            .catch(function (err) {
              console.error("Auto-load failed:", err)
              alert("Unable to auto-load DOS game:\n" + err.message)
            })
        }

        window.addEventListener("load", function () {
          setTimeout(tryInject, 1000)
        })
      })()
    </script>
  </body>
</html>
